services:
  app:
    build: .
    container_name: local_chat_api
    ports:
      - "8000:8000"
    environment:
      # Backend local compatible con OpenAI API.
      # Puede ser LM Studio, Ollama o similar.
      MODEL_BASE_URL: ${MODEL_BASE_URL:-http://host.docker.internal:1234/v1}
      MODEL_API_KEY: ${MODEL_API_KEY:-lm-studio}
      MODEL_NAME: ${MODEL_NAME:-openai/gpt-oss-20b}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/chat.db}
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped